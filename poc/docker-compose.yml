services:
  core:
    image: ${ACR_LOGIN_SERVER}/groupguard-core:latest
    build:
      context: .
      dockerfile: app/Dockerfile
    env_file:
      - .env
    environment:
      # Core and connector are separate hosts here, so localhost won't reach it.
      CONNECTOR_CONTROL_URL: http://connector:3001
    volumes:
      - ./data:/app/data
    expose:
      - "8000"
    restart: unless-stopped

  connector:
    # The reader number can hold only one Baileys session at a time — this VM is
    # now that one place. Do not run a second connector against the same session.
    image: ${ACR_LOGIN_SERVER}/groupguard-connector:latest
    build:
      context: ./connector-whatsapp
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      # Overrides for the in-container network (compose service names, not localhost/relative paths).
      CORE_SERVICE_URL: http://core:8000
      CONNECTOR_AUTH_DIR: /app/auth
    volumes:
      - ./connector-whatsapp/auth:/app/auth
    depends_on:
      - core
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - core
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
