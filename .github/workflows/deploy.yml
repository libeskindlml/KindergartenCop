name: Deploy to Azure

on:
  push:
    branches: [main]
    paths:
      - "poc/**"
      - ".github/workflows/deploy.yml"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push core image
        uses: docker/build-push-action@v6
        with:
          context: poc
          file: poc/app/Dockerfile
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/groupguard-core:${{ github.sha }}
            ${{ secrets.ACR_LOGIN_SERVER }}/groupguard-core:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push connector image
        uses: docker/build-push-action@v6
        with:
          context: poc/connector-whatsapp
          file: poc/connector-whatsapp/Dockerfile
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/groupguard-connector:${{ github.sha }}
            ${{ secrets.ACR_LOGIN_SERVER }}/groupguard-connector:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Azure VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/groupguard
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f

      - name: Verify health
        run: |
          sleep 5
          curl -fsS "https://${{ secrets.VM_HOST }}/health"
